<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gamewave - World Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 120px; } 
    button { margin-top: 0.5rem; padding: 0.5rem 1.5rem; }
    pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>🎮 Gamewave – Scene Generator</h1>
  <p>Enter a script or description:</p>
  <textarea id="input" placeholder="e.g. Coffee shop on the corner, downtown LA. NPC 'Barista' says hello.">Coffee shop on the corner, downtown LA. NPC "Barista" says hello.</textarea>
  <br />
  <button id="generateBtn">Generate Scene</button>
  <div id="result"></div>

  <script>
    document.getElementById('generateBtn').addEventListener('click', async () => {
      const input = document.getElementById('input').value.trim();
      if (!input) return;
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '<em>Generating...</em>';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input })
        });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        const data = await res.json();
        resultDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
      } catch (err) {
        resultDiv.innerHTML = `<p class="error">Error: ${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
